name: Build

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build on ${{ matrix.base_image }}
    strategy:
      matrix:
        include:
          - arch: none
            distro: none
            base_image: debian:bookworm
          - arch: armv7
            distro: bookworm
          - arch: aarch64
            distro: bookworm
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Get tag name
        id: tag
        run: echo "NAME=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

      - uses: uraimo/run-on-arch-action@v3.0.0
        name: Build binary for ${{ matrix.distro }} - ${{ matrix.arch }} - ${{ matrix.base_image }}
        id: build
        with:
          arch:  ${{ matrix.arch }}
          distro:  ${{ matrix.distro }}
          base_image: ${{ matrix.base_image }}
          dockerRunArgs: |
            --volume "${GITHUB_WORKSPACE}:/repository"
          install: |
                apt update -y
                apt install -y git golang make ca-certificates
          run: |
            git config --global --add safe.directory /repository
            cd /repository
            go get github.com/jmoiron/jsonq
            make go-build
            mv bin/api-samsungtv .
            strip api-samsungtv
            dist=$(cat /etc/os-release | grep VERSION_CODENAME | cut -d= -f2)
            mv api-samsungtv api-samsungtv-$dist-$(arch)

      - uses: actions/upload-artifact@v4.6.1
        with:
          name: ${{ matrix.arch }}
          path: api-samsungtv-*
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-24.04
    name: Publish release
    needs: build
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Get tag name
        id: tag
        run: echo "NAME=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4.1.9

      - name: Create artifact directory
        run: mkdir artifact

      - name: Move binaries to artifact directory
        run: find . -type f -name "api-samsungtv-*" -exec mv "{}" artifact \;

      - name: Create check sum file
        run: sha512sum api-samsungtv-* > api-samsungtv-SHA512.txt
        working-directory: artifact

      - name: Move artifacts to current folder
        run: mv artifact/* .

      - name: Create GitHub release
        id: release
        uses: actions/create-release@v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ steps.tag.outputs.NAME }}
          draft: true

      - name: Upload api-samsungtv Bookworm x86_64 to release
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: api-samsungtv-bookworm-x86_64
          asset_name: api-samsungtv-bookworm-x86_64
          asset_content_type: application/octet-stream

      - name: Upload api-samsungtv Bookworm armv7l to release
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: api-samsungtv-bookworm-armv7l
          asset_name: api-samsungtv-bookworm-armv7l
          asset_content_type: application/octet-stream

      - name: Upload api-samsungtv Bookworm aarch64 to release
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: api-samsungtv-bookworm-aarch64
          asset_name: api-samsungtv-bookworm-aarch64
          asset_content_type: application/octet-stream

      - name: Upload check sum file to release
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: api-samsungtv-SHA512.txt
          asset_name: api-samsungtv-SHA512.txt
          asset_content_type: text/plain

      - name: Publish release with notes
        uses: cyosp/publish-release-with-notes@2.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          id: ${{ steps.release.outputs.id }}
          version: ${{ steps.tag.outputs.NAME }}
          notes: ${{ github.workspace }}/RELEASE-NOTES.md
